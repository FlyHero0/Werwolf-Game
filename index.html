const NR={
eichhoernchen:'Das Eichhörnchen erwacht und huscht zu einem Menschen, den es ablenkt. Wer abgelenkt wird, kann in dieser Nacht nichts tun. Das Eichhörnchen schläft wieder ein.',

dorf:['Das Dorf triumphiert','Der letzte Werwolf fällt, und mit ihm weicht der Fluch von Düsterwald. Als die Sonne über die Hügel steigt, läuten die Glocken zum ersten Mal seit Monaten ohne Furcht. Die Überlebenden betrauern ihre Toten, doch sie wissen: Misstrauen, Mut und Zusammenhalt haben das Dorf gerettet. Heute Nacht bleiben die Türen offen, und im Wald schweigt nur noch der Wind.'],
wolf:['Die Nacht gehört den Wölfen','Als der letzte Verteidiger fällt, legen die Wölfe ihre Masken ab. Ein Heulen steigt zum Mond, und in Düsterwald erlischt Licht um Licht. Am Morgen finden Reisende nur verlassene Gassen und Pfotenspuren im Tau. Das Dorf ist nicht gestorben, es hat nur den Besitzer gewechselt.'],
liebe:['Die Liebe überdauert','Dorf und Rudel haben einander zerfleischt, doch zwei Herzen sind übrig, die sich über alle Lager hinweg gewählt haben. Hand in Hand treten die Liebenden aus dem Rauch in den Morgennebel. Hinter ihnen verglühen Fackeln und Fell, vor ihnen liegt ein Weg, den kein Pfeil und kein Zahn mehr erreicht. Manche Geschichten enden nicht mit einem Sieg, sondern mit Treue.'],
narr:['Der Narr lacht zuletzt','Als die Schlinge sich spannt, beginnt der Narr zu lachen, erst leise, dann so laut, dass es von den Fachwerkwänden widerhallt. Das Dorf hat in seiner Gier nach Gerechtigkeit den Einzigen gerichtet, der niemandem schadete. Das Urteil war sein Triumph, und Düsterwald schweigt beschämt.'],
none:['Düsterwald verstummt','Niemand ist übrig. Der Wind weht durch leere Gassen, Türen schlagen in der Dunkelheit. Nur der Mond weiß noch, was hier geschah, und er verrät es keinem.']};
const PR=['Hinter den Hügeln, wo selbst der Nebel zögert, liegt das Dorf Düsterwald. Seit dem Herbst verschwinden Schafe, dann Hunde, dann Menschen. Die Fensterläden bleiben nach Sonnenuntergang geschlossen.','Die Alten flüstern von Werwölfen, die am Tag unter uns leben: Nachbarn, Freunde, vertraute Gesichter. Erst wenn der Mond aufgeht, legen sie die Maske ab und gehen auf die Jagd.','Heute Nacht kehrt niemand in Ruhe heim. Jeder von euch trägt ein Geheimnis. Schließt die Augen, atmet tief durch und lasst die Nacht beginnen.'];

const DS={
werwolf:['Im Tod fällt die Maske: {n} war einer der Wölfe! Fell und Fänge glänzen im Mondlicht, und aus dem Wald antwortet ein Heulen, das langsam verstummt.','Fell bricht aus {n}s Haut, die Augen glimmen gelb, dann liegt alles still. Dem Rudel fehlt eine Stimme.','{n} war all die Tage ein Nachbar wie jeder andere. Jetzt wissen alle, wessen Gesicht hinter dem Wolf steckte.'],

seherin:['Die Kristallkugel zerspringt: Mit {n} verlischt das Auge des Dorfes.','{n} sah vieles voraus, nur das eigene Ende nicht.'],

jaeger:['{n} greift noch im Fallen nach dem Bogen: Ein letzter Schuss wartet auf sein Ziel.','Der Jäger {n} stirbt nicht still. Die Sehne spannt sich ein letztes Mal.'],
beschuetzer:['Der Schild zerbricht neben {n}. Wer hält jetzt die Hand über das Dorf?','{n} hat stets andere beschützt. Nun fehlt diese Hand.'],
amor:['{n} legt den Bogen für immer nieder, und der letzte Pfeil bleibt im Köcher.','Amor {n} stirbt, und ein Hauch von Rosenduft liegt über dem Platz.'],

const home=()=>`<section class="card hero ${F}"><div class=sig>🌘</div><h1>Düsterwald</h1><p class=say style="text-align:left">Der Mond steht hoch über dem Dorf. Irgendwo im Wald hat jemand geheult.</p><button class=btn onclick="newG()">Neues Spiel</button>${SV?'<button class="btn g" onclick="cont()">Spiel fortsetzen</button>':''}<button class="btn g" onclick="S.hp=1;render()">📖 Anleitung und Rollen</button><button class="btn g" onclick="S.st=1;render()">⚙️ Einstellungen</button></section>`;
const setup=()=>{const c=S.cfg;return`<section class="card ${F}"><h2>Das Dorf versammelt sich</h2>
<label>Spieler, ein Name pro Zeile</label><textarea rows=6 oninput="S.cfg.names=this.value" placeholder="Anna&#10;Ben&#10;Clara&#10;David">${esc(c.names)}</textarea>
<label>Werwölfe</label><div class=row><button class="btn g sm" onclick="wc(-1)">−</button><b class=big>${c.wolves}</b><button class="btn g sm" onclick="wc(1)">+</button></div><p class=nt>Faustregel: ein Werwolf pro vier bis fünf Spieler.</p><button class="btn g sm" onclick="rec()">✨ Empfehlung übernehmen</button>
<label>Optionen</label><button class="rl${c.cap?' on':''}" onclick="S.cfg.cap^=1;render()"><span>🎖️</span><div><b>Hauptmann</b><small>Wird am ersten Tag gewählt, seine Stimme zählt doppelt, bei Gleichstand entscheidet er.</small></div></button>
<label>Sonderrollen (der Rest wird Dorfbewohner)</label>${Object.keys(R).filter(k=>k!='werwolf'&&k!='dorf').map(k=>`<button class="rl${c.sp.includes(k)?' on':''}" onclick="ts('${k}')"><span>${R[k][1]}</span><div><b>${R[k][0]}</b><small>${R[k][2]}</small></div></button>`).join('')}
<button class=btn onclick="start()">Rollen verteilen</button></section>`};
const rolesV=()=>{const p=S.p[S.ri];
 if(!p)return`<section class="card hero ${F}"><div class=sig>📖</div><h2>Das Handy gehört der Spielleitung</h2><p class=say style="text-align:left">Alle Karten sind verteilt. Sind alle bereit, beginnt die Geschichte von Düsterwald.</p><button class=btn onclick="prol()">Spiel starten</button></section>`;
 if(!S.rs)return`<section class="card hero ${F}"><div class=sig>🂠</div><h2>${p.n}</h2><p class=say style="text-align:left">Nimm das Handy und schau heimlich auf deine Karte. Alle anderen schauen weg.</p><button class=btn onclick="S.rs=1;S.fi=1;render()">Meine Rolle aufdecken</button></section>`;
 const r=R[p.r];return`<section class="card hero flip ${F}"><div class=sig>${r[1]}</div><h2>${r[0]}</h2><p class=say style="text-align:left">${r[2]}</p><button class=btn onclick="S.ri++;S.rs=0;S.fi=1;render()">${S.ri<S.p.length-1?'Verstanden, weitergeben':'Verstanden, an die Spielleitung'}</button></section>`};
function prol(){S.scr='prol';S.pi=0;S.fi=1;pp()}
function pp(){say(PR[S.pi]);render()}
const prolV=()=>`<section class="card hero ${F}"><div class=sig>${['🏚️','🌕','🕯️'][S.pi]}</div><h2>Die Vorgeschichte</h2><p class=say style="text-align:left">${PR[S.pi]}</p><button class=btn onclick="${S.pi<2?'S.pi++;S.fi=1;pp()':'night()'}">${S.pi<2?'Weiter':'Die erste Nacht beginnt'}</button></section>`;
function nightV(){
 const k=S.ns[S.ni],t=S.t,c=CF[k],bl=t.bl!=null&&(P(t.bl).r==k||(k=='wolf'&&isW(P(t.bl))&&al(isW).length==1))?P(t.bl):null;let b;
 if(bl)b=`<p class=res>🐿️ ${bl.n} wurde abgelenkt${k=='wolf'?', das Rudel kann in dieser Nacht niemanden reißen.':' und kann in dieser Nacht nichts tun.'}</p><button class=btn onclick="nxt()">Weiter</button>`;
 else if(t.res)b=`<p class=res>${t.res}</p><button class=btn onclick="nxt()">Weiter</button>`;
 else if(k=='wolfshund')b=`<div class=row><button class=btn onclick="wh('werwolf')">👍 Werwolf</button><button class="btn g" onclick="wh('dorf')">👎 Dorfbewohner</button></div>`;
 else if(k=='hexe'){const v=t.v==null?null:P(t.v).n,cH=!S.hx[0]&&v!=null,cP=!S.hx[1];
  if(t.pm)b=`<h3>☠️ Wer soll vergiftet werden?</h3>`+pick()+ok('Gift einsetzen','pz()')+`<button class="btn g" onclick="S.t.po=null;hp(0)">${t.po!=null?'Gift doch nicht einsetzen':'Zurück'}</button>`;
  else b=`<p class=nt>Opfer der Wölfe: <b>${v||'niemand'}</b></p>`
   +(cH?`<button class="btn g${t.h?' on':''}" onclick="hl()">${t.h?'✔ ':''}🧪 Heiltrank einsetzen</button>`:S.hx[0]?'<p class=nt>Der Heiltrank ist verbraucht.</p>':'')
   +(cP?`<button class="btn g${t.po!=null?' on':''}" onclick="hp(1)">${t.po!=null?'✔ ':''}☠️ Gifttrank einsetzen${t.po!=null?': '+P(t.po).n:''}</button>`:'<p class=nt>Der Gifttrank ist verbraucht.</p>')
   +`<button class=btn onclick="act()">${t.h||t.po!=null?'Bestätigen':'Nichts tun'}</button>`}
 else{const cn=al(c[0]).length;b=(k=='wolf'&&t.bl!=null&&isW(P(t.bl))?`<p class=nt>🐿️ ${P(t.bl).n} ist abgelenkt und wacht nicht mit auf.</p>`:'')+pick(c[0],Math.min(c[1],cn),Math.min(c[2],cn))+ok('Bestätigen','act()')}
 return`<section class="card ${F}"><h2>${TT(k)}</h2><p class=nt>Nacht ${S.n}, Schritt ${S.ni+1} von ${S.ns.length}</p>${S.ni==0?`<p class=nt><i>${NF[S.nf||0]}</i></p>`:''}<p class=say>${NR[k]}</p><button class="btn g sm" onclick="say(NR.${k},1)">🗣️ Vorlesen</button>${b}</section>`}
const QT={j:['🏹','spannt den Bogen','Mit dem letzten Atemzug zielt der Jäger. Wen nimmt er mit?','Schießen'],c:['🎖️','ernennt den Nachfolger','Der sterbende Hauptmann reicht sein Amt weiter.','Amt übergeben']};
function qv(){const q=S.q[0],m=QT[q.t];return`<h3>${m[0]} ${P(q.i).n} ${m[1]}</h3><p class=say>${m[2]}</p>${pick()}${ok(m[3],'qa()')}`}
function dayV(){
 const d=S.ds,q=S.q.length,cp=S.p.find(p=>p.c&&p.a);let h,b;
 const nx=(l,f)=>q?qv():`<button class=btn onclick="${f}">${l}</button>`;
 if(d==0){h='Der Morgen graut';b=`<p class=say>${MORN[S.mi||0]}</p>`+rp('Alle haben die Nacht überlebt.')+(S.hn!=null?`<p class=nt>🐓 Der Hahn kräht: <b>${P(S.hn).n}</b> spricht zuerst.</p>`:'')+nx('Zur Dorfversammlung','nd()')}
 else if(d==1){h='Wahl des Hauptmanns';b=`<p class=say>Das Dorf wählt seinen Hauptmann. Seine Stimme zählt doppelt, bei Gleichstand entscheidet er.</p>`+pick()+ok('Zum Hauptmann krönen','cap()')}
 else if(d==2){h='Das Schafott';b=`<p class=say>Das Dorf berät frei am Tisch. Wen verurteilt die Mehrheit?</p>${cp?`<p class=nt>🎖️ Hauptmann ${cp.n}: Seine Stimme zählt doppelt, bei Gleichstand entscheidet er.</p>`:''}`+pick(()=>1,1,0)+ok(S.sel.length?'Hinrichten':'Niemand hinrichten','exec()')}
 else{h='Das Urteil';b=rp('Niemand wurde hingerichtet.')+nx('Die Nacht bricht an','nn()')}
 return`<section class="card ${F}"><h2>${h}</h2><p class=nt>Tag ${S.n}</p>${b}</section>`}
const game=()=>(S.ph=='n'?nightV():dayV())+`<div class=card>${ro()}</div>`;
function endV(){
 const e=EP[S.win],wf={dorf:p=>!isW(p)&&p.r!='narr',wolf:isW,liebe:p=>p.l!=null,narr:p=>p.r=='narr',none:()=>0}[S.win];
 return`<section class="card ${F}"><h2>${e[0]}</h2><p class=say>${e[1]}</p><p class=nt>🏆 ${S.p.filter(wf).map(p=>p.n).join(', ')||'Niemand'}</p><label>Alle Rollen im Licht</label>${S.p.map(p=>`<div class="rl${wf(p)?' on':''}"><span>${R[p.r][1]}</span><div><b>${p.n}${p.c?' 👑':''}${p.l!=null?' 💘':''}</b><small>${p.o?'Wolfshund als ':''}${R[p.r][0]}${p.w?', zum Werwolf geworden':''}, ${p.a?'überlebt':'gefallen'}</small></div></div>`).join('')}<button class=btn onclick="again()">🔁 Nochmal spielen</button><button class="btn g" onclick="again(1)">⚙️ Spieler oder Rollen ändern</button><button class="btn g" onclick="ch(1)">📜 Chronik lesen</button></section>`}
function chron(){let h='',c='';S.log.forEach(e=>{if(e.h!=c){c=e.h;h+=`<h3>${c}</h3>`}h+=`<p class=nt>${e.t}</p>`});
 return`<div class=ov onclick="ch(0)"><div class=card onclick="event.stopPropagation()"><h2>Die Chronik</h2>${h||'<p class=nt>Noch ist nichts geschehen.</p>'}<button class="btn g" onclick="ch(0)">Schließen</button></div></div>`}
function render(){
 F=S.fi?'fi':'';S.fi=0;const sc=S.scr;
 document.body.dataset.p=(sc=='game'&&S.ph=='d')||(sc=='end'&&['dorf','narr','liebe'].includes(S.win))?'d':'n';
 $('app').innerHTML=(sc=='home'||sc=='intro'?'':hdr())+({intro:introV,home,setup,roles:rolesV,prol:prolV,game,end:endV}[sc])()+(S.scr=='game'&&S.dl&&S.dl.length?dlV():'')+(S.ch?chron():'')+(S.hp?helpV():'')+(S.st?stV():'')+(S.qm?qmV():'');
 if(S.p.length)save();if(sc!='home'&&sc!='intro')wl();
 if(F)scrollTo(0,0)}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState=='visible'&&S.scr!='home'&&S.scr!='intro')wl()});
document.addEventListener('click',()=>{if(PF.mus&&(!AU||AU.paused))mplay()},true);
document.addEventListener('visibilitychange',()=>{if(!AU)return;if(document.visibilityState=='hidden')AU.pause();else mplay()});
render();
</script></body></html>
